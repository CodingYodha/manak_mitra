CONSUMER:
  name: Consumer Grievance & Verification
  description: >
    Routes for consumers who want to verify product authenticity,
    report counterfeit marks, or file grievances.
  helpline: "1800-11-4000"
  website: "https://bis.gov.in"
  care_app: "BIS CARE Mobile App (Android / iOS)"
  grievance_portal: "https://www.manakonline.in"
  routes:
    - trigger: "verify HUID"
      action: "Use BIS CARE Mobile App for authoritative HUID database lookup"
    - trigger: "fake ISI mark"
      action: "File grievance on BIS CARE App or call 1800-11-4000"
    - trigger: "fake hallmark"
      action: "File grievance on BIS CARE App or call 1800-11-4000"
    - trigger: "check CRS registration"
      action: "Verify R-number on crsbis.in portal"
    - trigger: "general complaint"
      action: "Contact BIS helpline 1800-11-4000 or visit bis.gov.in"
